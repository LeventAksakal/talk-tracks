# Overlay on compose.local.yml: the relay admits sessions through `moq auth serve` instead of letting anyone publish.
# Anyone may subscribe under talk/; publishing needs a token signed with the room key (wiki/howto/tokens.md).
#   docker compose -f deploy/compose.local.yml -f deploy/compose.auth.yml up -d
# The auth server shares the relay's network namespace: the relay only speaks plain HTTP to a loopback auth URL.
services:
  relay:
    command: ["--listen", "[::]:4443", "--listen-tls-generate", "relay,localhost", "--auth-url", "http://127.0.0.1:4440/",
              "--log-level", "info"]

  auth:
    image: talk-tracks-auth:0.14.8
    build: { context: ., dockerfile: Dockerfile.auth }
    network_mode: service:relay
    command: ["auth", "serve", "--listen", "127.0.0.1:4440", "--key", "/keys/public.jwk",
              "--public-subscribe", "talk/**"]
    volumes: ["${TT_KEYS:-../agents/data/keys}:/keys:ro"]
    restart: unless-stopped

  captions: &signed
    environment:
      TT_RELAY: moqt://relay:4443
      TT_ROOM: ${TT_ROOM:-dev}
      TT_TOKEN: ${TT_AGENT_TOKEN:-}
  translate-tr: *signed
  describe: *signed
  chapters: *signed
  teacher:
    environment:
      TT_RELAY: moqt://relay:4443
      TT_ROOM: ${TT_ROOM:-dev}
      TT_TOKEN: ${TT_SPEAKER_TOKEN:-}
