# Overlay on compose.local.yml: the relay admits sessions through `moq auth serve` instead of letting anyone publish.
# Anyone may subscribe under talk/; publishing needs a token signed with the room key (wiki/howto/tokens.md).
#   docker compose -f deploy/compose.local.yml -f deploy/compose.auth.yml up -d
# The relay speaks plain HTTP to its auth server only on loopback or a unix socket. The socket lives in a shared
# volume, so either container restarts on its own and finds the other again (sharing the relay's network namespace
# left auth cut off after every relay restart). The auth server needs no network at all.
services:
  relay:
    command: ["--listen", "[::]:4443", "--listen-tls-generate", "relay,localhost",
              "--auth-url", "unix:///run/auth/auth.sock", "--web-http-listen", "[::]:4443", "--log-level", "info"]
    depends_on: [auth]
    volumes: ["auth_sock:/run/auth"]

  auth:
    image: talk-tracks-auth:0.14.8
    build: { context: ., dockerfile: Dockerfile.auth }
    network_mode: none
    entrypoint: ["sh", "-c"]
    command:  # a socket left by a killed auth server would block the bind
      - rm -f /run/auth/auth.sock; exec moq auth serve --listen unix:/run/auth/auth.sock --key /keys/public.jwk
        --public-subscribe 'talk/**'
    volumes: ["${TT_KEYS:-../agents/data/keys}:/keys:ro", "auth_sock:/run/auth"]
    restart: unless-stopped

  captions: &signed
    environment:
      TT_RELAY: moqt://relay:4443
      TT_ROOM: ${TT_ROOM:-dev}
      TT_TOKEN: ${TT_AGENT_TOKEN:-}
  translate-tr: *signed
  describe: *signed
  chapters: *signed
  teacher:
    environment:
      TT_RELAY: moqt://relay:4443
      TT_ROOM: ${TT_ROOM:-dev}
      TT_TOKEN: ${TT_SPEAKER_TOKEN:-}
  generate:  # plays the lecture as the speaker of the generation room and records it
    environment:
      TT_RELAY: moqt://relay:4443
      TT_ROOM: ${TT_ROOM:-dev}
      TT_TOKEN: ${TT_SPEAKER_TOKEN:-}
  looper:  # the speaker and every agent of the demo room
    environment:
      TT_RELAY: moqt://relay:4443
      TT_ROOM: ${TT_DEMO_ROOM:-demo}
      TT_TOKEN: ${TT_LOOPER_TOKEN:-}

volumes:
  auth_sock: {}
