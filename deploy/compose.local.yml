# Local development: a relay and every agent in fake mode (scripted speech, fake model: no API calls, no cost).
#   docker compose -f deploy/compose.local.yml up -d --build
#   docker compose -f deploy/compose.local.yml --profile dev up teacher watch   # a stand-in speaker and viewer
# Agents reach the relay over raw QUIC with its self-generated certificate, hence --insecure.
name: talk-tracks

x-agent: &agent
  image: talk-tracks-agents:dev
  build: ../agents
  init: true  # Python as PID 1 ignores SIGTERM; a clean stop withdraws the agent's tracks at once
  restart: unless-stopped  # aiomoqt does not reconnect: the process exits and comes back as a fresh instance
  stop_grace_period: 15s  # time to close the session cleanly, so a replacement takes the track over at once
  depends_on: [relay]
  # The track archive (archive/ beside data/state): agents write their slices there and answer FETCH from it.
  volumes: ["../data/archive:/app/data/archive"]
  environment:
    TT_RELAY: moqt://relay:4443
    TT_ARCHIVE_BUCKET: ${TT_ARCHIVE_BUCKET:-}
    TT_ROOM: ${TT_ROOM:-dev}

services:
  relay:
    image: talk-tracks-relay:0.17.8
    build: { context: ., dockerfile: Dockerfile.relay }
    # The browser needs the web listener too: plain HTTP on the same port number (TCP) serves
    # /certificate.sha256 for WebTransport certificate pinning and the WebSocket fallback.
    command: ["--listen", "[::]:4443", "--listen-tls-generate", "relay,localhost", "--auth-public", "**",
              "--web-http-listen", "[::]:4443", "--log-level", "info"]
    ports: ["${TT_RELAY_PORT:-4443}:4443/udp", "${TT_RELAY_PORT:-4443}:4443/tcp"]
    restart: unless-stopped

  # The room service (wiki/howto/archive.md): records every room's speaker media, slides and event tracks into
  # data/archive/ (not in git), serves the event tracks' past by FETCH on talk/<room>/archive/slides and publishes
  # talk/<room>/catalog with its room track. No bucket copy unless TT_ARCHIVE_BUCKET is set (it needs Google
  # credentials, so leave it unset on a laptop).
  archive:
    <<: *agent
    volumes: ["../data/archive:/data/archive"]
    environment:
      TT_RELAY: moqt://relay:4443
      TT_ARCHIVE_DIR: /data/archive
      TT_ARCHIVE_SKIP: ${TT_ARCHIVE_SKIP:-${TT_DEMO_ROOM:-demo}}
      TT_ARCHIVE_BUCKET: ${TT_ARCHIVE_BUCKET:-}
    entrypoint: ["python", "-m", "talk_tracks.archive"]
    command: ["--insecure"]
  # The archive over HTTP, as Caddy serves it under /archive/ on the VM (the dev server can proxy /archive here).
  archive-files:
    image: caddy:2.10.2
    restart: unless-stopped
    volumes: ["../data/archive:/archive:ro"]
    command: ["caddy", "file-server", "--root", "/archive", "--listen", ":8080", "--browse"]
    ports: ["${TT_ARCHIVE_PORT:-8090}:8080/tcp"]

  captions:
    <<: *agent
    command: ["captions", "--fake", "--insecure"]
  translate-tr:
    <<: *agent
    command: ["translate", "--lang", "tr", "--fake", "--insecure"]
  translate-es:
    <<: *agent
    command: ["translate", "--lang", "es", "--fake", "--insecure"]
  translate-ar:
    <<: *agent
    command: ["translate", "--lang", "ar", "--fake", "--insecure"]
  describe:
    <<: *agent
    command: ["describe", "--fake", "--insecure"]
  chapters:
    <<: *agent
    command: ["chapters", "--fake", "--insecure"]

  teacher:
    <<: *agent
    profiles: [dev]
    restart: "no"
    command: ["teacher", "--insecure"]
  watch:
    <<: *agent
    profiles: [dev]
    restart: "no"
    command: ["watch", "--insecure"]

  # Demo rooms (wiki/howto/demo-rooms.md). Lectures and recordings live in data/demo/<lecture>/ (not in git).
  # TT_LECTURE names the lecture folder; agents and generate use TT_ROOM, the looping room is TT_DEMO_ROOM.
  media:
    image: talk-tracks-media:dev
    build: { context: ., dockerfile: Dockerfile.media }
    profiles: [demo]
    volumes: ["../data/demo:/data"]
    entrypoint: ["sh", "-c"]
  generate:
    <<: *agent
    profiles: [demo]
    restart: "no"
    volumes: ["../data/demo:/data"]
    # TT_SLIDES: the slide area for the describe agent's frames, x,y,w,h in fractions (0,0,0.77,0.77 for EMF talks)
    command: ["generate", "--insecure", "--media", "/data/${TT_LECTURE:-test}/lecture.mp4",
              "--out", "/data/${TT_LECTURE:-test}", "--slides", "${TT_SLIDES:-full}"]
  looper:
    <<: *agent
    profiles: [demo]
    volumes: ["../data/demo:/data:ro"]
    environment:
      TT_RELAY: moqt://relay:4443
      TT_ROOM: ${TT_DEMO_ROOM:-demo}
    # TT_SLIDES as for generate: the slides found in the video go out as the speaker's deck and slide tracks
    command: ["loop", "--insecure", "--recording", "/data/${TT_LECTURE:-test}", "--slides", "${TT_SLIDES:-full}"]
