# The public VM (decision 0004, wiki/howto/deploy.md): Caddy, the relay behind the token auth server, the demo rooms'
# live sessions and recording rooms and, once the Meta key is on the box, live agents. Settings come from
# deploy/.env on the VM (not in git):
#   TT_HOST          the public hostname (Caddy gets its certificate; the relay reuses it)
#   TT_KEYS          folder with public.jwk and private.jwk (the signing key never leaves the VM; only the room
#                    service reads it, to sign the speaker token of a room created by access code)
#   TT_DATA          folder with demo/<lecture>/ recordings and the agents' state, the spend ledger and archive/
#   TT_LOOPER_TOKEN  signed for the demo rooms virus, dataviz, rsa and qrcode; TT_AGENT_TOKEN signed for the agents of every room
#                    they serve
#   TT_SECRETS       folder with meta.env (META_API_KEY=..., mode 600), read by the live agents only
#   TT_LIVE_ROOMS    rooms the live agents serve: * (default) for any room a speaker opens, or a list a,b
#   TT_ROOM_CAP_USD  spend cap of any room (default 2); judge rooms take theirs from $TT_DATA/caps/ (mint script)
#   TT_IDLE_GRACE_S  how long a track goes without demand before its agent pauses (default 10)
#   TT_ARCHIVE_BUCKET the Cloud Storage bucket the track archive is copied to (optional); TT_ARCHIVE_SKIP rooms
#                    not archived (default: the demo rooms and *-recording); TT_ARCHIVE_TOKEN the room service's token
#   TT_DEMO_LIVE_AGENTS 1: the demo rooms' AI tracks come from the live agents only (default unset: the recordings',
#                    at their real delays); TT_DEMO_SESSION_GAP_S the gap between two sessions (default 30)
#   TT_RECORDINGS_TOKEN signed for the four recording rooms (wiki/howto/demo-rooms.md)
#   docker compose -f deploy/compose.vm.yml up -d
#   docker compose -f deploy/compose.vm.yml --profile live up -d        # live agents
#   docker compose -f deploy/compose.vm.yml --profile recordings up -d  # the recording rooms, once built
# Agents reach the relay inside the compose network, where the certificate's name does not match, hence --insecure.
name: talk-tracks

x-agent: &agent
  image: talk-tracks-agents:${TT_AGENTS_TAG:-dev}
  build: ../agents
  init: true
  restart: unless-stopped
  stop_grace_period: 15s  # time to close the session cleanly, so a replacement takes the track over at once
  depends_on: [relay]
  volumes: ["${TT_DATA:?}:/data"]
  environment: &agent-env
    TT_RELAY: moqt://relay:443
    TT_ROOM: ${TT_LIVE_ROOM:-live}
    TT_TOKEN: ${TT_AGENT_TOKEN:-}
    TT_LEDGER: /data/ledger.jsonl
    TT_MOQ_MAX_STREAMS_BIDI: ${TT_MOQ_MAX_STREAMS_BIDI:-}  # bidi stream credit for the relay; unset keeps 512 (moq.py stream_credit)
    TT_STATE_DIR: /data/state
    TT_ARCHIVE_DIR: /data/archive  # each agent's slices: what it serves FETCH from and restarts from
    TT_ARCHIVE_BUCKET: ${TT_ARCHIVE_BUCKET:-}  # slices missing on disk are read from it (decision 0012)
    TT_SPEND_CEILING_USD: ${TT_SPEND_CEILING_USD:-100}

# Live agents call the Meta API: only they get the key, and the ledger in $TT_DATA holds them under the ceiling and
# each room under its cap. They are lazy (wiki/howto/lazy-agents.md): each serves every wanted room a speaker opens,
# and pays only while someone subscribes to its track. The demo rooms are theirs only with TT_DEMO_LIVE_AGENTS=1 in
# .env (decision 0032): then the demo rooms leave TT_ROOMS_EXCLUDE and each live session is served on its own clock.
x-live: &live
  <<: *agent
  profiles: [live]
  env_file: ["${TT_SECRETS:-/nonexistent}/meta.env"]
  environment:
    <<: *agent-env
    TT_ROOMS: ${TT_LIVE_ROOMS:-*}
    TT_ROOMS_EXCLUDE: ${TT_DEMO_ROOMS:-virus,dataviz,rsa,qrcode,demo}  # the demo rooms, unless TT_DEMO_LIVE_AGENTS
    TT_DEMO_ROOMS: ${TT_DEMO_ROOMS:-virus,dataviz,rsa,qrcode,demo}  # served session by session, never back-filled
    TT_DEMO_LIVE_AGENTS: ${TT_DEMO_LIVE_AGENTS:-}
    TT_ROOM_CAP_USD: ${TT_ROOM_CAP_USD:-2}
    TT_CAPS_DIR: /data/caps
    TT_IDLE_GRACE_S: ${TT_IDLE_GRACE_S:-10}

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports: ["80:80/tcp", "443:443/tcp"]
    environment: [TT_HOST]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv:ro
      - ${TT_DATA:?}/archive:/archive:ro
      - caddy_data:/data
      - caddy_config:/config

  # QUIC and WebTransport on UDP 443 with Caddy's certificate; the HTTPS listener on 8443 is reached only through
  # Caddy (WebSocket fallback). The relay reads the certificate at start: restart it after Caddy renews.
  relay:
    image: talk-tracks-relay:0.17.8
    build: { context: ., dockerfile: Dockerfile.relay }
    restart: unless-stopped
    depends_on: [caddy, auth]
    ports: ["443:443/udp"]
    environment: [TT_HOST]
    volumes: ["caddy_data:/caddy:ro", "auth_sock:/run/auth"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          crt=$$(ls /caddy/caddy/certificates/*/$$TT_HOST/$$TT_HOST.crt 2>/dev/null | head -1)
          [ -n "$$crt" ] && break
          echo "waiting for the certificate of $$TT_HOST"; sleep 3
        done
        exec moq-relay --listen '[::]:443' --listen-tls-cert "$$crt" --listen-tls-key "$${crt%.crt}.key" \
          --web-https-listen '[::]:8443' --web-https-cert "$$crt" --web-https-key "$${crt%.crt}.key" \
          --auth-url unix:///run/auth/auth.sock --log-level info --stats-enabled --stats-interval 2

  # The relay speaks plain HTTP to its auth server only on loopback or a unix socket. The socket lives in a shared
  # volume, so either container restarts on its own and finds the other again. (Sharing the relay's network namespace
  # left auth cut off after the relay restarted by itself: 3 hours down on 2026-10-28.) Auth needs no network.
  auth:
    image: talk-tracks-auth:0.14.8
    build: { context: ., dockerfile: Dockerfile.auth }
    network_mode: none
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:  # a socket left by a killed auth server would block the bind
      - rm -f /run/auth/auth.sock; exec moq auth serve --listen unix:/run/auth/auth.sock --key /keys/public.jwk
        --public-subscribe 'talk/**'
    volumes: ["${TT_KEYS:?}/public.jwk:/keys/public.jwk:ro", "auth_sock:/run/auth"]

  # One demo room per lecture (ticket 0001, decision 0032), named after it: the recording is $TT_DATA/demo/<room>/.
  # Each runs live sessions one after the other (wiki/howto/demo-rooms.md): the lecture once from 00:00, the room
  # ends, and after TT_DEMO_SESSION_GAP_S (default 30) the next session starts from 00:00. TT_DEMO_LIVE_AGENTS=1 in
  # .env: no recorded AI track goes out, the live agents (profile live) make them, under each room's spend cap; unset,
  # the recording's tracks go out at the delay their agents really had. TT_LOOPER_TOKEN is signed for all four rooms
  # (wiki/howto/tokens.md). --slides auto: the slides are cut from the lecture's slide region in regions.json beside it
  # (find-regions, run once per lecture; without the file, the whole frame), found in the video at start (about a
  # minute) and sent as the speaker's deck and slide tracks (and, live, the frames the describe agent reads). The
  # regions also go in the room catalog: the player's camera tile shows only the webcam inset.
  looper-virus: &looper
    <<: *agent
    environment: &looper-env
      <<: *agent-env
      TT_ROOM: virus
      TT_TOKEN: ${TT_LOOPER_TOKEN:-}
      TT_DEMO_LIVE_AGENTS: ${TT_DEMO_LIVE_AGENTS:-}
      TT_DEMO_SESSION_GAP_S: ${TT_DEMO_SESSION_GAP_S:-30}
      TT_CAPS_DIR: /data/caps  # read for the catalog's capped status of the live agents' tracks
      TT_ROOM_CAP_USD: ${TT_ROOM_CAP_USD:-2}
    command: ["session", "--insecure", "--recording", "/data/demo/virus", "--slides", "auto"]
  looper-dataviz:
    <<: *looper
    environment:
      <<: *looper-env
      TT_ROOM: dataviz
    command: ["session", "--insecure", "--recording", "/data/demo/dataviz", "--slides", "auto"]
  looper-rsa:
    <<: *looper
    environment:
      <<: *looper-env
      TT_ROOM: rsa
    command: ["session", "--insecure", "--recording", "/data/demo/rsa", "--slides", "auto"]
  looper-qrcode:
    <<: *looper
    environment:
      <<: *looper-env
      TT_ROOM: qrcode
    command: ["session", "--insecure", "--recording", "/data/demo/qrcode", "--slides", "auto"]

  # Each demo lecture's recording room, <room>-recording (decision 0032): an ended room of the archive that
  # `record-archive` built once (wiki/howto/demo-rooms.md), whose media Caddy serves as HLS. This serves its catalog,
  # room track and recorded AI tracks by FETCH from the archived slices, and its slides from memory. Profile
  # recordings, once the rooms are built. TT_RECORDINGS_TOKEN may publish talk/<room>-recording/catalog, /agents/**,
  # /slides and /archive/** of the four rooms (wiki/howto/demo-rooms.md).
  recording-virus: &recording
    <<: *agent
    profiles: [recordings]
    environment: &recording-env
      <<: *agent-env
      TT_ROOM: virus-recording
      TT_TOKEN: ${TT_RECORDINGS_TOKEN:-}
    command: ["serve-recording", "--insecure", "--media", "/data/demo/virus/lecture.mp4", "--slides", "auto"]
  recording-dataviz:
    <<: *recording
    environment:
      <<: *recording-env
      TT_ROOM: dataviz-recording
    command: ["serve-recording", "--insecure", "--media", "/data/demo/dataviz/lecture.mp4", "--slides", "auto"]
  recording-rsa:
    <<: *recording
    environment:
      <<: *recording-env
      TT_ROOM: rsa-recording
    command: ["serve-recording", "--insecure", "--media", "/data/demo/rsa/lecture.mp4", "--slides", "auto"]
  recording-qrcode:
    <<: *recording
    environment:
      <<: *recording-env
      TT_ROOM: qrcode-recording
    command: ["serve-recording", "--insecure", "--media", "/data/demo/qrcode/lecture.mp4", "--slides", "auto"]

  # The room service (wiki/howto/archive.md): follows every room under talk/** into $TT_DATA/archive, which Caddy
  # serves under /archive/. It records the speaker's media, slide frames and event tracks (deck, slide, ink, marks,
  # pointer) off the relay, serves the event tracks' past by FETCH on talk/<room>/archive/slides (decision 0022),
  # and publishes talk/<room>/catalog with its room track, talk/<room>/chat and talk/<room>/stats (its token,
  # $TT_ARCHIVE_TOKEN, may publish talk/*/catalog, talk/*/comments, talk/*/annotations, talk/*/chat, talk/*/stats and
  # talk/*/archive/**, and subscribe .stats/** for the relay's counters; wiki/howto/tokens.md).
  # Listeners write their ink, text marks and comments to it over a WebSocket on :8091, which Caddy proxies from
  # /api/ (decision 0024); it tells the speaker's token from a listener by the room key's public.jwk.
  # Presenters create rooms on :8092 (POST /api/rooms, decision 0025): it checks the access code in
  # $TT_DATA/room-codes.json (never in git; wiki/howto/tokens.md), records the room under the code's caps batch in
  # $TT_DATA/caps/, and signs the speaker token with private.jwk.
  # Agents write their own slices into the same folder
  # (/data/archive in their mount; decision 0012); the archiver never subscribes to them. Finished files, slices
  # included, are copied to the Cloud Storage bucket $TT_ARCHIVE_BUCKET with the VM's service account; unset, nothing
  # leaves the VM. Demo rooms are skipped (nothing of them is archived or copied): each session player publishes its
  # room's catalog. The room service publishes only their chat and stats tracks (TT_LOOPED_ROOMS, archive.looped) and
  # keeps their chat, capped, in $TT_DATA/looped/, outside the archive Caddy serves and the bucket copy. The recording
  # rooms (<room>-recording) are in the archive, but skipped here too: the recordings services serve them.
  archive:
    image: talk-tracks-agents:${TT_AGENTS_TAG:-dev}
    build: ../agents
    init: true  # SIGTERM closes the open segments
    restart: unless-stopped
    depends_on: [relay]
    volumes:
      - ${TT_DATA:?}:/data  # the archive, and the spend ledger read for the catalog's capped status
      - ${TT_KEYS:?}/public.jwk:/keys/public.jwk:ro  # checks the speaker's token at the listener endpoint
      - ${TT_KEYS:?}/private.jwk:/keys/private.jwk:ro  # signs the speaker token of a created room
    environment:
      TT_RELAY: moqt://relay:443
      TT_TOKEN: ${TT_ARCHIVE_TOKEN:-}
      TT_LISTEN: 0.0.0.0:8091
      TT_CREATE_LISTEN: 0.0.0.0:8092
      TT_ROOM_CODES: /data/room-codes.json  # access codes, beside the archive, never in the folder Caddy serves
      TT_SIGNING_KEY: /keys/private.jwk
      TT_ROOMS_DIR: /data/rooms  # each created room's title and speaker
      TT_ROOMS_HIDDEN: /data/rooms-hidden.txt  # rooms GET /api/rooms never lists (wiki/howto/tokens.md)
      TT_ROOM_TOKEN_HOURS: ${TT_ROOM_TOKEN_HOURS:-48}
      TT_DEMO_ROOMS: ${TT_DEMO_ROOMS:-virus,dataviz,rsa,qrcode,demo}  # never created by code
      TT_SPEAKER_KEY: /keys/public.jwk
      TT_LISTENER_ORIGINS: https://${TT_HOST}
      TT_PROXIED: "1"
      TT_LISTENER_SECRET_FILE: /data/room-service.key  # beside the archive, never in the folder Caddy serves
      TT_ARCHIVE_DIR: /data/archive
      TT_LEDGER: /data/ledger.jsonl
      TT_CAPS_DIR: /data/caps
      TT_ROOM_CAP_USD: ${TT_ROOM_CAP_USD:-2}
      TT_SPEND_CEILING_USD: ${TT_SPEND_CEILING_USD:-100}
      # The demo rooms, and their recording rooms, whose catalog the recordings services publish (built once by
      # record-archive: stop this service while it runs, it rewrites rooms.json)
      TT_ARCHIVE_SKIP: ${TT_ARCHIVE_SKIP:-${TT_DEMO_ROOMS:-virus,dataviz,rsa,qrcode,demo},*-recording}
      TT_LOOPED_ROOMS: ${TT_DEMO_ROOMS:-virus,dataviz,rsa,qrcode,demo}  # the demo rooms: chat and stats only
      TT_LOOPED_DIR: /data/looped  # their chat, beside the archive, never in it
      TT_ARCHIVE_BUCKET: ${TT_ARCHIVE_BUCKET:-}
      TT_RELAY_STATS: .stats/node  # the relay's --stats-enabled counters (Stats for nerds); empty: counts unknown
    entrypoint: ["python", "-m", "talk_tracks.archive"]
    command: ["--insecure"]

  captions:
    <<: *live
    command: ["captions", "--insecure"]
  # Every translation (decision 0035): one lazy track per language of contracts/languages.json in each room it
  # serves, which spends only while a viewer subscribes (live) or fetches a past slice (back-fill), against the
  # room's cap. Nothing is pre-made. Like the other live agents it serves the demo rooms only with
  # TT_DEMO_LIVE_AGENTS=1 (live only, session by session); then it also serves the recording rooms built in the
  # archive (<id>-recording/room.json), back-fill only, from their archived captions, for good: they have no speaker
  # and are ended from the start.
  translate-any:
    <<: *live
    command: ["translate", "--lang", "any", "--insecure"]
  describe:
    <<: *live
    command: ["describe", "--insecure"]
  chapters:
    <<: *live
    command: ["chapters", "--insecure"]

volumes:
  auth_sock: {}  # the auth server's unix socket, shared with the relay
  # The volume the pre-event stack already filled, so the certificate carries over.
  caddy_data: { external: true, name: moq_caddy_data }
  caddy_config: { external: true, name: moq_caddy_config }
