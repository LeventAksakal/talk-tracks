# The public VM (decision 0004, wiki/howto/deploy.md): Caddy, the relay behind the token auth server, the looping
# demo room and, once the Meta key is on the box, live agents. Settings come from deploy/.env on the VM (not in git):
#   TT_HOST          the public hostname (Caddy gets its certificate; the relay reuses it)
#   TT_KEYS          folder with public.jwk (the signing key never leaves the VM)
#   TT_DATA          folder with demo/<lecture>/ recordings, the agents' state, the spend ledger and archive/
#   TT_LOOPER_TOKEN  signed for the demo room; TT_AGENT_TOKEN signed for the agents of every room they serve
#   TT_SECRETS       folder with meta.env (META_API_KEY=..., mode 600), read by the live agents only
#   TT_LIVE_ROOMS    rooms the live agents serve: * (default) for any room a speaker opens, or a list a,b
#   TT_ROOM_CAP_USD  spend cap of any room (default 2); judge rooms take theirs from $TT_DATA/caps/ (mint script)
#   TT_ARCHIVE_BUCKET the Cloud Storage bucket the track archive is copied to (optional); TT_ARCHIVE_SKIP rooms
#                    not archived (default: the demo room)
#   docker compose -f deploy/compose.vm.yml up -d
#   docker compose -f deploy/compose.vm.yml --profile live up -d      # live agents
# Agents reach the relay inside the compose network, where the certificate's name does not match, hence --insecure.
name: talk-tracks

x-agent: &agent
  image: talk-tracks-agents:${TT_AGENTS_TAG:-dev}
  build: ../agents
  init: true
  restart: unless-stopped
  depends_on: [relay]
  volumes: ["${TT_DATA:?}:/data"]
  environment: &agent-env
    TT_RELAY: moqt://relay:443
    TT_ROOM: ${TT_LIVE_ROOM:-live}
    TT_TOKEN: ${TT_AGENT_TOKEN:-}
    TT_LEDGER: /data/ledger.jsonl
    TT_STATE_DIR: /data/state
    TT_SPEND_CEILING_USD: ${TT_SPEND_CEILING_USD:-100}

# Live agents call the Meta API: only they get the key, and the ledger in $TT_DATA holds them under the ceiling and
# each room under its cap. They are lazy (wiki/howto/lazy-agents.md): each serves every wanted room a speaker opens,
# and pays only while someone subscribes to its track. The demo room is the looper's, never theirs.
x-live: &live
  <<: *agent
  profiles: [live]
  env_file: ["${TT_SECRETS:-/nonexistent}/meta.env"]
  environment:
    <<: *agent-env
    TT_ROOMS: ${TT_LIVE_ROOMS:-*}
    TT_ROOMS_EXCLUDE: ${TT_DEMO_ROOM:-demo}
    TT_ROOM_CAP_USD: ${TT_ROOM_CAP_USD:-2}
    TT_CAPS_DIR: /data/caps

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports: ["80:80/tcp", "443:443/tcp"]
    environment: [TT_HOST]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv:ro
      - ${TT_DATA:?}/archive:/archive:ro
      - caddy_data:/data
      - caddy_config:/config

  # QUIC and WebTransport on UDP 443 with Caddy's certificate; the HTTPS listener on 8443 is reached only through
  # Caddy (WebSocket fallback). The relay reads the certificate at start: restart it after Caddy renews.
  relay:
    image: talk-tracks-relay:0.17.8
    build: { context: ., dockerfile: Dockerfile.relay }
    restart: unless-stopped
    depends_on: [caddy]
    ports: ["443:443/udp"]
    environment: [TT_HOST]
    volumes: ["caddy_data:/caddy:ro"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          crt=$$(ls /caddy/caddy/certificates/*/$$TT_HOST/$$TT_HOST.crt 2>/dev/null | head -1)
          [ -n "$$crt" ] && break
          echo "waiting for the certificate of $$TT_HOST"; sleep 3
        done
        exec moq-relay --listen '[::]:443' --listen-tls-cert "$$crt" --listen-tls-key "$${crt%.crt}.key" \
          --web-https-listen '[::]:8443' --web-https-cert "$$crt" --web-https-key "$${crt%.crt}.key" \
          --auth-url http://127.0.0.1:4440/ --log-level info

  auth:
    image: talk-tracks-auth:0.14.8
    build: { context: ., dockerfile: Dockerfile.auth }
    network_mode: service:relay
    restart: unless-stopped
    command: ["auth", "serve", "--listen", "127.0.0.1:4440", "--key", "/keys/public.jwk",
              "--public-subscribe", "talk/**"]
    volumes: ["${TT_KEYS:?}/public.jwk:/keys/public.jwk:ro"]

  looper:
    <<: *agent
    environment:
      <<: *agent-env
      TT_ROOM: ${TT_DEMO_ROOM:-demo}
      TT_TOKEN: ${TT_LOOPER_TOKEN:-}
    command: ["loop", "--insecure", "--recording", "/data/demo/${TT_LECTURE:-test}"]

  # The track archive (wiki/howto/archive.md): follows every room under talk/** into $TT_DATA/archive, which Caddy
  # serves under /archive/ and restarting agents read (/data/archive). It records the teacher broadcast off the relay
  # and agent output from the agents' own spool ($TT_DATA/archive-spool, never a subscription: that would keep lazy
  # agents awake). Finished files are copied to the Cloud
  # Storage bucket $TT_ARCHIVE_BUCKET with the VM's service account; unset, nothing leaves the VM. Looped demo rooms
  # are skipped: their recording already is their archive.
  archive:
    image: talk-tracks-agents:${TT_AGENTS_TAG:-dev}
    build: ../agents
    init: true  # SIGTERM closes the open segments and chunks
    restart: unless-stopped
    depends_on: [relay]
    volumes: ["${TT_DATA:?}/archive:/data/archive", "${TT_DATA:?}/archive-spool:/data/archive-spool"]
    environment:
      TT_RELAY: moqt://relay:443
      TT_ARCHIVE_DIR: /data/archive
      TT_ARCHIVE_SPOOL: /data/archive-spool
      TT_ARCHIVE_SKIP: ${TT_ARCHIVE_SKIP:-${TT_DEMO_ROOM:-demo}}
      TT_ARCHIVE_BUCKET: ${TT_ARCHIVE_BUCKET:-}
    entrypoint: ["python", "-m", "talk_tracks.archive"]
    command: ["--insecure"]

  captions:
    <<: *live
    command: ["captions", "--insecure"]
  translate-tr:
    <<: *live
    command: ["translate", "--lang", "tr", "--insecure"]
  describe:
    <<: *live
    command: ["describe", "--insecure"]
  chapters:
    <<: *live
    command: ["chapters", "--insecure"]

volumes:
  # The volume the pre-event stack already filled, so the certificate carries over.
  caddy_data: { external: true, name: moq_caddy_data }
  caddy_config: { external: true, name: moq_caddy_config }
