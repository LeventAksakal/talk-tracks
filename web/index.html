<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Live talks with AI tracks: captions, translations, slide descriptions, chapters."
    />
    <link rel="preload" href="/fonts/tt-title-700.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Brand images are built by web/scripts/brand/build.ts. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07080d" />
    <!-- Link previews. %TT_SITE_URL% is the deployment's origin, set at build time (vite.config.ts); never committed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Talk Tracks" />
    <meta property="og:title" content="Talk Tracks" />
    <meta
      property="og:description"
      content="Live lectures you can rewind, with AI tracks you pick: subtitles in your language, chapters and slide descriptions."
    />
    <meta property="og:image" content="%TT_SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Talk Tracks: the three-lane logo beside a timeline of a talk's tracks (speaker, captions, translations, slides) running to the live edge."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Talk Tracks" />
    <meta
      name="twitter:description"
      content="Live lectures you can rewind, with AI tracks you pick: subtitles in your language, chapters and slide descriptions."
    />
    <meta name="twitter:image" content="%TT_SITE_URL%/og.png" />
    <meta
      name="twitter:image:alt"
      content="Talk Tracks: the three-lane logo beside a timeline of a talk's tracks (speaker, captions, translations, slides) running to the live edge."
    />
    <title>Talk Tracks</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
